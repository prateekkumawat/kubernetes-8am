apiVersion: v1
kind: Namespace
metadata:
  name: apps1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apps1
  namespace: apps1
spec:
  selector:
    matchLabels:
      app: apps1
  template:
    metadata:
      labels:
        app: apps1
    spec:
      containers:
      - name: apps1
        image: prateekkumawat/villa:latest 
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: apps1-svc
  namespace: apps1
spec:
  selector:
    app: apps1
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps1-ingress
  labels:
    app: apps1
  namespace: apps1  
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/protocols: "http"
spec:
  ingressClassName: kong
  rules:
  - host: apps1.apps.ocelottraining.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: apps1-svc
            port: 
              number: 80


