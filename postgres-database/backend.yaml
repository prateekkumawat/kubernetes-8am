apiVersion: v1
kind: Namespace
metadata:
  name: pulse-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-api-app
  namespace: pulse-backend
spec:
  selector:
    matchLabels:
      app: apiapp
  template:
    metadata:
      labels:
        app: apiapp
    spec:
      containers:
      - name: pulse-api-app
        image: prateekkumawat/apiapp:be-1.0
        resources:
          requests: 
            memory: "500Mi"
            cpu: "500m"
          limits:
            memory: "800Mi"
            cpu: "1"
        ports:
        - containerPort: 8080
          name: http-port
        env:   
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-svc.pulse-database.svc.cluster.local:5432/apidb
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: redhat123
        - name: CORS_ALLOWED_ORIGINS
          value: "http://pulse.apps.ocelottraining.com,http://api.apps.ocelottraining.com"
        - name: SPRING_PROFILES_ACTIVE
          value: prod

---
apiVersion: v1
kind: Service
metadata:
  name: pusle-api-app-svc
  namespace: pulse-backend
spec:
  selector:
    app: apiapp
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: NodePort  
