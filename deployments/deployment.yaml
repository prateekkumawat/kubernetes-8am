apiVersion: v1
kind: Namespace
metadata:
  name: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: frontend 
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
      - name: react-app
        image: prateekkumawat/coreui:latest 
        resources:
          requests: 
            memory: "350Mi"
            cpu: "700m"
          limits:
            memory: "800Mi"
            cpu: "1000m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: react-app-svc
  namespace: frontend 
spec:
  selector:
    app: react
  ports:
  - port: 80
    targetPort: 80
  type: NodePort
