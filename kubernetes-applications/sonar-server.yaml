apiVersion: v1
kind: Namespace
metadata:
  name: sonar

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-app
  namespace: sonar
spec:
  selector:
    matchLabels:
      app: sonar
  template:
    metadata:
      labels:
        app: sonar
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: sonar
        image: sonarqube:latest
        env:
        - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
          value: "true"
        resources:
          requests: 
            memory: "500Mi"
            cpu: "700m"
          limits:
            memory: "2Gi"
            cpu: "2"
        ports:
        - containerPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: sonar-svc
  namespace: sonar
spec:
  selector:
    app: sonar
  ports:
  - port: 80
    targetPort: 9000
  type: NodePort
