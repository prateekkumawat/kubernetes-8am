apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql-pma
  template:
    metadata:
      labels:
        app: mysql-pma
    spec:
      containers:
      - name: phpmyadmin
        image: phpmyadmin:latest
        resources:
          requests: 
            memory: "300Mi"
            cpu: "300m"
          limits:
            memory: "1000Mi"
            cpu: "700m"
        ports:
        - containerPort: 80
          name: pma-web
        env: 
        - name: PMA_HOST
          value: mysql-svc.mysql.svc.cluster.local
        - name: PMA_PORT
          value: "3306"        
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: mysql
spec:
  selector:
    app: mysql-pma
  type: NodePort  
  ports:
  - port: 80
    targetPort: 80
    name: pma-web
