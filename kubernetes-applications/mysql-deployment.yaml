apiVersion: v1
kind: Namespace
metadata:
  name: mysql

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-vol
  namespace: mysql
spec:
  resources:
    requests:
      storage: 2Gi
  storageClassName: ebs-sc
  accessModes:
    - ReadWriteOnce

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-admin-creds
  namespace: mysql
type: Opaque
data:
  rootpassword: UmVkaGF0MTIzNDU2

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-user-creds
  namespace: mysql
type: Opaque
data:
  userpassword: UmVkaGF0MTIzNDU2
  username: bXNrdWJl

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      volumes:
      - name: data-collect
        persistentVolumeClaim: 
          claimName: mysql-data-vol
      containers:
      - name: mysql
        image: mysql:latest
        resources:
          requests: 
            memory: "300Mi"
            cpu: "300m"
          limits:
            memory: "1000Mi"
            cpu: "700m"
        ports:
        - containerPort: 3306
          name: mysql
        env: 
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: 
            secretKeyRef: 
              name: mysql-admin-creds
              key: rootpassword
        - name: MYSQL_USER 
          valueFrom: 
            secretKeyRef: 
              name: mysql-user-creds
              key: username
        - name: MYSQL_PASSWORD
          valueFrom: 
            secretKeyRef: 
              name: mysql-user-creds
              key: userpassword
        - name: MYSQL_DATABASE
          value: kubedata
        volumeMounts:
        - name: data-collect
          mountPath: /var/lib/mysql

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
