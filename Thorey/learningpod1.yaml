apiVersion: v1
kind: Namespace
metadata:
  name: learningpod1 

---
apiVersion: v1
kind: Pod
metadata:
  name: learningpod1
  namespace: learningpod1
  labels:
    app: learningpod1
spec:
  containers:
  - name: myapp
    image: nginx:latest
    ports:
      - containerPort: 80
  - name: sidecar
    image: busybox:latest
    command: ["sh", "-c", "while true; do echo Hello from the sidecar!; sleep 5; done"]
  - name: init-container
    image: busybox:latest
    command: ["sh", "-c", "while true; do echo Initializing the pod...; sleep 5; done"]