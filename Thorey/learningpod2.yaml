apiVersion: v1
kind: Pod
metadata:
  name: apache
  labels:
    appname: apache
spec:
  containers:
  - name: apache
    image: httpd:latest
    ports:
      - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: apache-svc
spec:
  selector:
    appname: apache
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
